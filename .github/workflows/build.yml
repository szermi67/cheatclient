name: Kompilator Purple-Clienta Fabric
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobieranie projektu
        uses: actions/checkout@v4

      - name: Konfiguracja Javy 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Automatyczne generowanie czystej struktury projektu
        run: |
          mkdir -p src/main/java/pl/serwer/nopush/mixin
          mkdir -p src/main/java/pl/serwer/nopush/gui
          mkdir -p src/main/resources

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { maven { url = 'https://fabricmc.net' }; mavenCentral() } }
          rootProject.name = 'purple-client'
          EOF

          echo "org.gradle.jvmargs=-Xmx2G" > gradle.properties

          cat << 'EOF' > build.gradle
          plugins { id 'fabric-loom' version '1.9-SNAPSHOT' }
          version = '1.0.0'
          group = 'pl.serwer.nopush'
          dependencies {
              minecraft 'com.mojang:minecraft:1.21.4'
              mappings 'net.fabricmc:yarn:1.21.4+build.1:v2'
              modImplementation 'net.fabricmc:fabric-loader:0.16.9'
          }
          tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
          java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
          EOF

      - name: Tworzenie konfiguracji srodowiska Fabric Loader
        run: |
          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "purple-client",
            "version": "1.0.0",
            "name": "Purple Client",
            "description": "Twoj wlasny, autorski cheat-client w fioletowych barwach.",
            "authors": ["Serwer"],
            "license": "MIT",
            "environment": "client",
            "mixins": ["purple.mixins.json"],
            "depends": { "fabricloader": ">=0.16.9", "minecraft": "~1.21.4" }
          }
          EOF

          cat << 'EOF' > src/main/resources/purple.mixins.json
          {
            "required": true,
            "package": "pl.serwer.nopush.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "LocalPlayerMixin",
              "AntiBlindnessMixin",
              "KeyboardMixin",
              "GameRendererMixin"
            ]
          }
          EOF
      - name: Tworzenie Zaawansowanego Menedzera Przelacznikow i Opcji (ModSettings)
        run: |
          cat << 'EOF' > src/main/java/pl/serwer/nopush/gui/ModSettings.java
          package pl.serwer.nopush.gui;
          public class ModSettings {
              public static int guiKey = 344;
              public static boolean noPushActive = false;
              public static boolean antiBlindActive = false;
              public static boolean killauraActive = false;
              public static boolean chestStealerActive = false;
              public static boolean tracersActive = false;
              public static boolean noHurtCam = true;
              public static int noPushKey = 0;
              public static int antiBlindKey = 0;
              public static int killauraKey = 0;
              public static int chestStealerKey = 0;
              public static int tracersKey = 0;
              public static float tracersThickness = 2.0f;
              public static int tracersColor = 0xFFFF00FF;
              public static double killauraRange = 4.2;
          }
          EOF

      - name: Budowanie fioletowego Dropdown GUI z bindowaniem i opcjami Tracers
        run: |
          cat << 'EOF' > src/main/java/pl/serwer/nopush/gui/ClickGuiScreen.java
          package pl.serwer.nopush.gui;
          
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.text.Text;
          
          public class ClickGuiScreen extends Screen {
              private boolean bindingMode = false;
              private boolean settingsMode = false;
              private String targetModule = "";
          
              public ClickGuiScreen() {
                  super(Text.of("Purple Client Menu"));
              }
              
              @Override
              public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                  int x = this.width / 4;
                  int y = this.height / 6;
                  int w = this.width / 2;
                  int h = (this.height * 2) / 3;
                  
                  context.fill(x, y, x + w, y + h, 0xCC110022); 
                  context.fill(x, y, x + w, y + 24, 0xFF4A0E70); 
                  context.drawText(this.textRenderer, "★ PURPLE CLIENT - DROPDOWN SYSTEM ★", x + 15, y + 8, 0xFFFFFFFF, false);
                  
                  if (bindingMode) {
                      context.fill(x + 10, y + h - 25, x + w - 10, y + h - 5, 0xFFFF0055);
                      context.drawText(this.textRenderer, "[BIND] Wcisnij klawisz dla: " + targetModule, x + 20, y + h - 18, 0xFFFFFFFF, false);
                  }
                  
                  drawModuleButton(context, "NoPush", x + 20, y + 40, ModSettings.noPushActive, ModSettings.noPushKey);
                  drawModuleButton(context, "AntiBadEffects", x + 20, y + 68, ModSettings.antiBlindActive, ModSettings.antiBlindKey);
                  drawModuleButton(context, "Killaura", x + 20, y + 96, ModSettings.killauraActive, ModSettings.killauraKey);
                  drawModuleButton(context, "ChestStealer", x + 20, y + 124, ModSettings.chestStealerActive, ModSettings.chestStealerKey);
                  drawModuleButton(context, "Tracers", x + 20, y + 152, ModSettings.tracersActive, ModSettings.tracersKey);
                  
                  if (settingsMode) {
                      int sx = x + 250;
                      context.fill(sx, y, sx + 130, y + 120, 0xFF200035);
                      context.fill(sx, y, sx + 130, y + 18, 0xFF6A0DAD);
                      context.drawText(this.textRenderer, "Opcje: " + targetModule, sx + 5, y + 5, 0xFFFFFF00, false);
                      
                      if (targetModule.equals("Tracers")) {
                          context.drawText(this.textRenderer, "Grubosc: " + ModSettings.tracersThickness, sx + 10, y + 30, 0xFFFFFFFF, false);
                          context.drawText(this.textRenderer, "[L: Zwieksz]", sx + 10, y + 45, 0xFF00FF00, false);
                          context.drawText(this.textRenderer, "Kolor: Fiolet", sx + 10, y + 65, 0xFFFFFFFF, false);
                      } else if (targetModule.equals("Killaura")) {
                          context.drawText(this.textRenderer, "Zasieg: " + ModSettings.killauraRange, sx + 10, y + 30, 0xFFFFFFFF, false);
                      } else {
                          context.drawText(this.textRenderer, "Brak dodatkowych", sx + 10, y + 35, 0xFFB0B0B0, false);
                          context.drawText(this.textRenderer, "ustawien.", sx + 10, y + 48, 0xFFB0B0B0, false);
                      }
                      context.drawText(this.textRenderer, "[KLIKNIJ TU BY ZAMKNAC]", sx + 5, y + 100, 0xFFFF3333, false);
                  }
                  
                  super.render(context, mouseX, mouseY, delta);
              }
              
              private void drawModuleButton(DrawContext context, String name, int x, int y, boolean active, int key) {
                  int btnColor = active ? 0xFF8A2BE2 : 0xFF2D2D2D;
                  context.fill(x, y, x + 210, y + 22, btnColor);
                  String bindName = key == 0 ? "NONE" : String.valueOf((char)key);
                  context.drawText(this.textRenderer, name + " [" + bindName + "]", x + 8, y + 7, 0xFFFFFFFF, false);
              }
              
              @Override
              public boolean mouseClicked(double mouseX, double mouseY, int button) {
                  int x = this.width / 4;
                  int y = this.height / 6;
                  
                  if (settingsMode && mouseX >= x+250 && mouseX <= x+380 && mouseY >= y+100 && mouseY <= y+115) {
                      settingsMode = false;
                      return true;
                  }
                  
                  if (settingsMode && targetModule.equals("Tracers") && button == 0) {
                      if (mouseX >= x+250 && mouseX <= x+380 && mouseY >= y+45 && mouseY <= y+58) {
                          ModSettings.tracersThickness += 0.5f;
                          if (ModSettings.tracersThickness > 5.0f) ModSettings.tracersThickness = 1.0f;
                          return true;
                      }
                  }
                  
                  if (button == 0 && !bindingMode) {
                      if (mouseX >= x + 20 && mouseX <= x + 230) {
                          if (mouseY >= y + 40 && mouseY <= y + 62) ModSettings.noPushActive = !ModSettings.noPushActive;
                          if (mouseY >= y + 68 && mouseY <= y + 90) ModSettings.antiBlindActive = !ModSettings.antiBlindActive;
                          if (mouseY >= y + 96 && mouseY <= y + 118) ModSettings.killauraActive = !ModSettings.killauraActive;
                          if (mouseY >= y + 124 && mouseY <= y + 146) ModSettings.chestStealerActive = !ModSettings.chestStealerActive;
                          if (mouseY >= y + 152 && mouseY <= y + 174) ModSettings.tracersActive = !ModSettings.tracersActive;
                      }
                  }
                  
                  if (button == 1) {
                      if (mouseX >= x + 20 && mouseX <= x + 230) {
                          bindingMode = true;
                          settingsMode = true;
                          if (mouseY >= y + 40 && mouseY <= y + 62) targetModule = "NoPush";
                          if (mouseY >= y + 68 && mouseY <= y + 90) targetModule = "AntiBadEffects";
                          if (mouseY >= y + 96 && mouseY <= y + 118) targetModule = "Killaura";
                          if (mouseY >= y + 124 && mouseY <= y + 146) targetModule = "ChestStealer";
                          if (mouseY >= y + 152 && mouseY <= y + 174) targetModule = "Tracers";
                      }
                  }
                  return super.mouseClicked(mouseX, mouseY, button);
              }
              
              @Override
              public boolean keyPressed(int keyCode, int scanCode, int modifiers) {
                  if (bindingMode) {
                      if (keyCode != 256) {
                          if (targetModule.equals("NoPush")) ModSettings.noPushKey = keyCode;
                          if (targetModule.equals("AntiBadEffects")) ModSettings.antiBlindKey = keyCode;
                          if (targetModule.equals("Killaura")) ModSettings.killauraKey = keyCode;
                          if (targetModule.equals("ChestStealer")) ModSettings.chestStealerKey = keyCode;
                          if (targetModule.equals("Tracers")) ModSettings.tracersKey = keyCode;
                      }
                      bindingMode = false;
                      return true;
                  }
                  return super.keyPressed(keyCode, scanCode, modifiers);
              }
              
              @Override
              public boolean shouldPause() { return false; }
          }
          EOF
      - name: Tworzenie Mixinow (NoPush, AntiBlindness, GameRenderer, Keyboard z obsługą bindowania z klawiatury)
        run: |
          cat << 'EOF' > src/main/java/pl/serwer/nopush/mixin/LocalPlayerMixin.java
          package pl.serwer.nopush.mixin;
          import net.minecraft.client.player.LocalPlayer;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;
          import pl.serwer.nopush.gui.ModSettings;
          @Mixin(LocalPlayer.class)
          public class LocalPlayerMixin {
              @Inject(method = "pushOutOfBlocks", at = @At("HEAD"), cancellable = true)
              private void onPushOutOfBlocks(double x, double z, CallbackInfoReturnable<Boolean> cir) {
                  if (ModSettings.noPushActive) cir.setReturnValue(false);
              }
          }
          EOF

          cat << 'EOF' > src/main/java/pl/serwer/nopush/mixin/AntiBlindnessMixin.java
          package pl.serwer.nopush.mixin;
          import net.minecraft.client.player.LocalPlayer;
          import net.minecraft.entity.effect.StatusEffect;
          import net.minecraft.entity.effect.StatusEffects;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;
          import net.minecraft.registry.entry.RegistryEntry;
          import pl.serwer.nopush.gui.ModSettings;
          @Mixin(LocalPlayer.class)
          public class AntiBlindnessMixin {
              @Inject(method = "hasStatusEffect", at = @At("HEAD"), cancellable = true)
              private void onHasStatusEffect(RegistryEntry<StatusEffect> effect, CallbackInfoReturnable<Boolean> cir) {
                  if (ModSettings.antiBlindActive && (effect.value() == StatusEffects.BLINDNESS || effect.value() == StatusEffects.DARKNESS)) cir.setReturnValue(false);
              }
          }
          EOF

          cat << 'EOF' > src/main/java/pl/serwer/nopush/mixin/GameRendererMixin.java
          package pl.serwer.nopush.mixin;
          import net.minecraft.client.render.GameRenderer;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
          import pl.serwer.nopush.gui.ModSettings;
          @Mixin(GameRenderer.class)
          public class GameRendererMixin {
              @Inject(method = "tiltViewWhenHurt", at = @At("HEAD"), cancellable = true)
              private void onTiltViewWhenHurt(CallbackInfo ci) { if (ModSettings.noHurtCam) ci.cancel(); }
          }
          EOF

          cat << 'EOF' > src/main/java/pl/serwer/nopush/mixin/KeyboardMixin.java
          package pl.serwer.nopush.mixin;
          import net.minecraft.client.Keyboard;
          import net.minecraft.client.MinecraftClient;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
          import pl.serwer.nopush.gui.ModSettings;
          import pl.serwer.nopush.gui.ClickGuiScreen;
          @Mixin(Keyboard.class)
          public class KeyboardMixin {
              @Inject(method = "onKey", at = @At("HEAD"))
              private void onKeyInput(long window, int key, int scancode, int action, int modifiers, CallbackInfo ci) {
                  if (key == ModSettings.guiKey && action == 1 && MinecraftClient.getInstance().currentScreen == null) {
                      MinecraftClient.getInstance().execute(() -> MinecraftClient.getInstance().setScreen(new ClickGuiScreen()));
                      return;
                  }
                  if (action == 1 && MinecraftClient.getInstance().currentScreen == null) {
                      if (key == ModSettings.noPushKey) ModSettings.noPushActive = !ModSettings.noPushActive;
                      if (key == ModSettings.antiBlindKey) ModSettings.antiBlindActive = !ModSettings.antiBlindActive;
                      if (key == ModSettings.killauraKey) ModSettings.killauraActive = !ModSettings.killauraActive;
                      if (key == ModSettings.chestStealerKey) ModSettings.chestStealerActive = !ModSettings.chestStealerActive;
                      if (key == ModSettings.tracersKey) ModSettings.tracersActive = !ModSettings.tracersActive;
                  }
              }
          }
          EOF

      - name: Inicjalizacja srodowiska i kompilacja kodu JAR
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Przesylanie gotowego Purple Clienta na dysk
        uses: actions/upload-artifact@v4
        with:
          name: Purple-Client-JAR
          path: build/libs/*
